<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Study Planner</title>
  </head>
  <body>
    <h1>Student Study Planner</h1>

    <p>Plan your study and track your progress.</p>

    <h2>Today's Tasks</h2>

    <ul>
      <li>Study C++</li>
      <li>Practice Git</li>
      <li>Review lessons</li>
      <li>Java sript </li>
    </ul>
    <script>
function calculateProgress(completedTasks, totalTasks) {
    if (totalTasks === 0) {
        return 0;
    }

    return Math.round((completedTasks / totalTasks) * 100);
}

// Example
const completedTasks = 3;
const totalTasks = 5;

const progress = calculateProgress(completedTasks, totalTasks);

console.log("Study Progress: " + progress + "%");
</script>
  </body>
</html>
